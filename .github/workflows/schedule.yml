name: Daily Job Crawler

on:
  schedule:
    - cron: '0 0 * * *' # 매일 한국 시간 오전 9시 (UTC 0시) 실행
  workflow_dispatch: # 내가 원할 때 바로 실행할 수 있는 수동 버튼

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 크롤러 실행
        run: python collector.py

      - name: 수집된 데이터를 GitHub에 자동 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_data.json
          git commit -m "Auto-update job data" || echo "새로운 공고가 없습니다."
          git push
